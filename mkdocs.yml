site_name: MENoBiS
site_description: Max Entropy NOn Binary Suite for null modeling
site_url: https://uladribia.github.io/menobis/
repo_url: https://github.com/uladribia/menobis
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Start here:
      - Home: index.md
      - Getting started: getting-started.md
      - Main use cases: examples/main-use-cases.ipynb
      - Thesis and citations: thesis-context.md
  - Tutorials:
      - Filter a network: tutorials/filter-network.md
      - Sample ensemble magnitudes: tutorials/sample-ensemble-magnitudes.md
      - Use spatial costs: tutorials/use-spatial-costs.md
  - Model selection and maths:
      - Choose a null model: concepts/choose-null-model.md
      - Equations: concepts/equations.md
      - Partial constraints: concepts/partial-constraints.md
      - Microcanonical sampling: concepts/microcanonical.md
      - Solvers and scaling: concepts/solvers-and-scaling.md
      - Filtering statistics: concepts/filtering.md
  - Reference:
      - Python API: api/python.md
      - File formats: api/file-formats.md
      - Filtering API: api/filtering.md
      - Network metrics: api/network-metrics.md
      - Rust API: api/rust.md
      - CLI:
          - Fit: cli/fit.md
          - Generate: cli/generate.md
          - Filter: cli/filter.md
  - Development:
      - Extending thesis cases: development/extending-thesis-cases.md
      - Testing: development/testing.md
      - Benchmarking: development/benchmarking.md
      - Microcanonical strength-cost benchmark: benchmarks/microcanonical_strength_cost.md
      - Scalability: development/scalability.md
      - Fetching real-world data: development/fetching-data.md
      - Release process: development/release-process.md
      - TODOs: development/todos.md
      - Architecture: development/architecture.md
      - Phase 0 migration notes: development/migration-notes.md
      - Agent specs:
          - Overview: development/agent-specifications/README.md
          - Framework intro: development/agent-specifications/00_intro.md
          - Phase 0 refactor: development/agent-specifications/microcanonical-phase-0.md
          - Fixed-SE sampling framework plan: development/agent-specifications/05_microcanonical_sampling_framework_fixed_se_plan.md
          - Phase 1 ME fixed-(E,T) design: development/agent-specifications/01_phase1_me_fixed_et_design.md
          - Phase 1 ME fixed-(E,T) implementation: development/agent-specifications/02_phase1_me_fixed_et_implementation.md
          - Phase 2 B fixed-(E,T): development/agent-specifications/03_phase2_b_fixed_et.md
          - Phase 2 W fixed-(E,T): development/agent-specifications/04_phase2_w_fixed_et.md
          - Phase 3 fixed-(k,T) plan: development/agent-specifications/05_phase3_fixed_kt_plan.md
          - Phase 4 fixed strengths: development/agent-specifications/06_phase4_fixed_strengths_me_b_w_final.md
          - Phase 5 strength + expected cost: development/agent-specifications/07_phase5_fixed_strength_expected_cost_final.md
          - Phase 6 scalability refactor: development/agent-specifications/08_scalable_fixed_total_gibbs_migration_final.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

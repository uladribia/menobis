site_name: MENoBiS
site_description: Max Entropy NOn Binary Suite for null modeling
site_url: https://uladribia.github.io/menobis/
repo_url: https://github.com/uladribia/menobis
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Start:
      - Overview: index.md
      - Getting started: getting-started.md
      - Choose a model: guide/choose-model.md
      - Supported models: guide/supported-models.md

  - User guide:
      - Fit and sample: guide/fit-and-sample.md
      - Ensemble statistics: guide/ensemble-statistics.md
      - Filter node pairs: guide/filter-network.md
      - Spatial costs: guide/spatial-costs.md
      - Fixed / known pairs: guide/fixed-pairs.md
      - Microcanonical sampling: guide/microcanonical.md

  - Examples:
      - Main use cases: examples/main-use-cases.ipynb
      - Micro vs grand-canonical in practice: examples/grand-vs-micro-practical.ipynb

  - Scientific foundations:
      - Notation: science/notation.md
      - Event families ME, B, W: science/event-families.md
      - Constraints: science/constraints.md
      - Ensembles: science/ensembles.md
      - Ensemble equivalence: science/ensemble-equivalence.md
      - Filtering statistics: science/filtering.md
      - References and thesis: science/references.md

  - Performance and validation:
      - Practical scaling: performance/scaling.md
      - Benchmarks: performance/benchmarks.md
      - MCMC diagnostics: performance/mcmc-diagnostics.md
      - Validation: performance/validation.md

  - Reference:
      - Python API: api/python.md
      - File formats: api/file-formats.md
      - Network metrics: api/network-metrics.md
      - Filtering API: api/filtering.md
      - Rust API: api/rust.md
      - CLI:
          - Fit: cli/fit.md
          - Generate: cli/generate.md
          - Filter: cli/filter.md
          - Benchmarks: cli/benchmarks.md

  - Contributing:
      - Architecture: development/architecture.md
      - Extending MENoBiS: development/extending-thesis-cases.md
      - Microcanonical algorithms: development/microcanonical-algorithms.md
      - Responsibilities: development/responsibilities.md
      - Testing: development/testing.md
      - Release process: development/release-process.md

exclude_docs: |
  /development/agent-specifications/
  /_generated/

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
      base_path: docs
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
